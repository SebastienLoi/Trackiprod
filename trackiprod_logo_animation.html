<script>
(function() {
  // ── Paramètres ──────────────────────────────────────────────
  var LOGO_SPEED = 10;    // secondes pour le logo
  var LET_SPEED  = 5;     // secondes par lettre
  var SW         = 3;     // épaisseur de trait

  // Palette bleu/violet/cyan — sans vert
  var COLORS_LIGHT = ['#1A3A5C','#2C5F8A','#00B4CC','#5B4FCF','#8B6FE8','#2C5F8A'];
  var COLORS_DARK  = ['#E8F4F8','#00B4CC','#7EB8F7','#A78BFA','#60A5FA','#C4B5FD'];

  var LETTER_IDS = ['tp-p1','tp-p2','tp-p3','tp-p4','tp-p5',
                    'tp-p6','tp-p7','tp-p8','tp-p9','tp-p10'];
  var DETAIL_MAP = {'tp-p12':0,'tp-p13':1,'tp-p14':2,
                    'tp-p15':6,'tp-p16':7,'tp-p17':8,'tp-p18':9};

  // ── Détection du thème ──────────────────────────────────────
  // Lit la luminosité de --color-background-primary pour détecter dark/light
  function isDark() {
    var val = getComputedStyle(document.documentElement)
                .getPropertyValue('--color-background-primary').trim();
    if (!val) return false;
    var hex = val.replace('#','');
    if (hex.length === 6) {
      var r = parseInt(hex.slice(0,2),16);
      var g = parseInt(hex.slice(2,4),16);
      var b = parseInt(hex.slice(4,6),16);
      return (r + g + b) < 380;
    }
    return false;
  }

  // ── Longueur d'un path ──────────────────────────────────────
  function getLen(el) {
    try { return el.getTotalLength(); } catch(e) { return 600; }
  }

  // ── Anime un path ───────────────────────────────────────────
  function animPath(el, speed, delay, colorIdx, strokeW) {
    var dark   = isDark();
    var colors = dark ? COLORS_DARK : COLORS_LIGHT;
    var ci     = colorIdx % colors.length;
    var l      = getLen(el);
    var id     = el.id;

    el.style.strokeWidth      = strokeW;
    el.style.fill             = 'none';
    el.style.stroke           = colors[0];
    el.style.strokeDasharray  = l;
    el.style.strokeDashoffset = l;
    el.style.animation        = 'none';
    el.getBoundingClientRect(); // force reflow

    // Injecte les keyframes propres à ce path
    var old = document.getElementById('tp-ks-' + id);
    if (old) old.remove();
    var st = document.createElement('style');
    st.id = 'tp-ks-' + id;
    st.textContent =
      '@keyframes tp-draw-' + id + '{' +
        'from{stroke-dashoffset:' + l + ';} to{stroke-dashoffset:0;}' +
      '}' +
      '@keyframes tp-col-' + id + '{' +
        '0%{stroke:' + colors[ci] + ';}' +
        '25%{stroke:' + colors[(ci+1)%colors.length] + ';}' +
        '50%{stroke:' + colors[(ci+2)%colors.length] + ';}' +
        '75%{stroke:' + colors[(ci+3)%colors.length] + ';}' +
        '100%{stroke:' + colors[ci] + ';}' +
      '}';
    document.head.appendChild(st);

    el.style.animation =
      'tp-draw-' + id + ' ' + speed + 's ease ' + delay + 's forwards, ' +
      'tp-col-'  + id + ' ' + (speed*1.5) + 's linear ' + (delay+speed) + 's infinite';
  }

  // ── Lance toute l'animation ─────────────────────────────────
  function animate() {
    // Fond selon thème
    var dark = isDark();
    var bg = document.getElementById('tp-logo-bg');
    if (bg) bg.style.background = dark ? '#1E2A3A' : 'transparent';

    // Logo principal
    var logo = document.getElementById('tp-p0');
    if (logo) animPath(logo, LOGO_SPEED, 0, 0, SW);

    // Lettres TRACKIPROD
    LETTER_IDS.forEach(function(id, i) {
      var el = document.getElementById(id);
      if (el) animPath(el, LET_SPEED, LOGO_SPEED + i * LET_SPEED * 0.55, i+1, SW * 0.85);
    });

    // Détails intérieurs
    Object.keys(DETAIL_MAP).forEach(function(id) {
      var li = DETAIL_MAP[id];
      var el = document.getElementById(id);
      if (!el) return;
      var delay = li === 0 ? 0 : LOGO_SPEED + li * LET_SPEED * 0.55;
      animPath(el, LET_SPEED, delay, li+1, SW * 0.7);
    });
  }

  // ── Lancement initial ───────────────────────────────────────
  animate();

  // ── Observe les changements de thème ───────────────────────
  // WeWeb toggle ajoute/retire des classes sur <html> ou <body>
  // → on relance l'animation depuis le début
  var observer = new MutationObserver(function() { animate(); });
  observer.observe(document.documentElement,
    { attributes: true, attributeFilter: ['class','data-theme'] });
  observer.observe(document.body,
    { attributes: true, attributeFilter: ['class','data-theme'] });

})();
</script>
