<style>
  #tp-wrap { display:flex; justify-content:center; align-items:center; padding:2rem 1rem; width:100%; box-sizing:border-box; }
  #tp-bg { border-radius:16px; padding:2rem; transition:background 0.4s; width:100%; max-width:700px; box-sizing:border-box; }
  #tp-svg { width:100%; height:auto; display:block; }
  #tp-svg path { fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-width:2; }

  /* Animation dessin (stroke-dashoffset) */
  @keyframes draw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
</style>

        <stop offset="50%"  stop-color="#00B4CC"/>
        <stop offset="100%" stop-color="#1A3A5C"/>
        <animateTransform attributeName="gradientTransform" type="rotate"
          values="0 199 165; 360 199 165" dur="6s" repeatCount="indefinite"/>
      </linearGradient>

      <!-- Lueur glissante par-dessus (option 2) -->
      <linearGradient id="g-glide" gradientUnits="userSpaceOnUse" x1="-300" y1="-300" x2="-100" y2="-100">
        <stop offset="0%"   stop-color="#1A3A5C" stop-opacity="0"/>
        <stop offset="40%"  stop-color="#1A3A5C" stop-opacity="0"/>
        <stop offset="50%"  stop-color="#E8F4F8" stop-opacity="0.9"/>
        <stop offset="60%"  stop-color="#1A3A5C" stop-opacity="0"/>
        <stop offset="100%" stop-color="#1A3A5C" stop-opacity="0"/>
        <animateTransform attributeName="gradientTransform" type="translate"
          values="-600 -600; 900 900" dur="3s" repeatCount="indefinite"/>
      </linearGradient>
    </defs>

<script>
(function(){
  var SPEED = 8;

  function isDark(){
    var v=getComputedStyle(document.documentElement).getPropertyValue('--color-background-primary').trim();
    if(!v) return false;
    var h=v.replace('#','');
    if(h.length===6) return parseInt(h.slice(0,2),16)+parseInt(h.slice(2,4),16)+parseInt(h.slice(4,6),16)<380;
    return false;
  }

  function updateTheme(){
    var dark = isDark();
    document.getElementById('tp-bg').style.background = dark ? '#1E2A3A' : 'transparent';

    // Adapter les couleurs du gradient tournant selon le thème
    var spinStops = document.querySelectorAll('#g-spin stop');
    if(dark){
      spinStops[0].setAttribute('stop-color','#2C5F8A');
      spinStops[1].setAttribute('stop-color','#00B4CC');
      spinStops[2].setAttribute('stop-color','#2C5F8A');
    } else {
      spinStops[0].setAttribute('stop-color','#1A3A5C');
      spinStops[1].setAttribute('stop-color','#00B4CC');
      spinStops[2].setAttribute('stop-color','#1A3A5C');
    }
    // Lueur : blanc en light, cyan clair en dark
    var glideStop = document.querySelectorAll('#g-glide stop')[2];
    glideStop.setAttribute('stop-color', dark ? '#7EB8F7' : '#E8F4F8');
  }

  function animateDraw(){
    var paths = document.querySelectorAll('#tp-svg path');

    paths.forEach(function(path){
      var len = path.getTotalLength();
      path.style.strokeDasharray = len;
      path.style.strokeDashoffset = len;
      path.style.setProperty('--len', len);

      // Phase 1 : dessin progressif avec gradient tournant
      path.style.stroke = 'url(#g-spin)';
      path.style.animation = 'none';
      path.getBoundingClientRect();
      path.style.animation = 'draw ' + SPEED + 's ease forwards';
    });

    // Phase 2 : après le dessin, ajouter la lueur glissante par-dessus via un clone
    setTimeout(function(){
      var svg = document.getElementById('tp-svg');
      var existing = document.getElementById('tp-glide-layer');
      if(existing) existing.remove();

      // Créer un groupe de clones avec le gradient lueur
      var g = document.createElementNS('http://www.w3.org/2000/svg','g');
      g.id = 'tp-glide-layer';

      var origPaths = document.querySelectorAll('#tp-svg > path');
      origPaths.forEach(function(p){
        var clone = p.cloneNode(true);
        clone.removeAttribute('id');
        clone.style.animation = 'none';
        clone.style.strokeDasharray = 'none';
        clone.style.strokeDashoffset = '0';
        clone.style.stroke = 'url(#g-glide)';
        clone.style.strokeWidth = '3';
        g.appendChild(clone);
      });
      svg.appendChild(g);
    }, SPEED * 1000);
  }

  updateTheme();
  animateDraw();

  var obs = new MutationObserver(function(){
    updateTheme();
  });
  obs.observe(document.documentElement,{attributes:true,attributeFilter:['class','data-theme']});
  obs.observe(document.body,{attributes:true,attributeFilter:['class','data-theme']});

  // Relance l'animation depuis le début sur réception d'un postMessage 'replay'
  window.addEventListener('message', function(e){
    if(e.data && e.data.type === 'replay'){
      var existing = document.getElementById('tp-glide-layer');
      if(existing) existing.remove();
      animateDraw();
    }
    // Gestion du thème (déjà existant)
    if(e.data && e.data.type === 'set-theme'){
      updateTheme();
    }
  });
})();
</script>
